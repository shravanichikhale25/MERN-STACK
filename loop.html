<!-- WAP to print 10 to 1 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=10;
        while(a>=1)
        {
            console.log(a);
            a--;
        }
    </script>
</body>
</html>
