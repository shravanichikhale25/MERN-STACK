<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN FORM</title>
</head>
<body>
    <h1>LOGIN FORM</h1>
    <input type="text" name="" id="user" placeholder="Enter Username">
    <br> <br>
    <input type="password" name="" id="pass" placeholder="Enter password">
    <button onclick="getData()">LOGIN</button>
    <h1 id="msg"></h1>
    <script>
         var user="admin";
         var pass="admin@123";

        function getData()
        {
           
            var msg=document.getElementById("msg")
            var a=document.getElementById("user")
            var b=document.getElementById("pass")
            if(a.value==user && b.value==pass)
            {
                msg.innerHTML="login successfull"
                msg.innerHTML="hello "+a.value
            }
            else
            {
                msg.innerHTML="login fail"
            }
            
        }
    </script> 
</body>
</html>
