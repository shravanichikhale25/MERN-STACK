<!--Discount on bill , given by user -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILL AND DISCOUNT</title>
</head>
<body>
    <script>
            var bill = Number(prompt("Enter your bill"))
            if(bill>=5000)
            {
                console.log("discount is 20%")
            }
            else if(bill>=3000)
            {
                console.log("discount is 10%")
            }
            else if(bill>=1000)
            {
                console.log("discount is 5%")
            }
            else
            {
                console.log("no discount")
            }
    </script>
</body>
</html>
