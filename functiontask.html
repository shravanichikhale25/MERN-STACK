<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNCTIONS</title>
</head>
<body>
    <h1>Amezon Lite</h1>
    <label for="">Enter Product Price</label>
    <input type="number"name="" id="price">
    <br><br>
    <label for="">Enter Product Quantity</label>
    <input type="number"name="" id="qn">
    <br><br>
    <button onclick="getBill()">Calculate Bill</button>
    <br><br>
    <button onclick="getDiscount1()">Apply 10% Discount</button> 
    <button onclick="getDiscount2()">Apply 20% Discount</button> 
    <button onclick="getDiscount3()">Apply 30% Discount</button> 
    <h2 id="result"></h2>

    <script>
        var price=document.getElementById("price");
        var qn=document.getElementById("qn");
        var result=document.getElementById("result");
        let totalBill=0;
        function getBill()
        {
            totalBill=(price.value)*(qn.value);
            result.innerHTML="Total Bill ="+totalBill; 
        }

        function getDiscount1()
        {
            if(totalBill>=1000)
            {
                let discount = totalBill*0.10;
                result.innerHTML="Total Bill="+totalBill+
                                  "<br> Discount 10% ="+discount+
                                  "<br> Final bill ="+(totalBill-discount)+
                                  "<br> <button>proceed to pay</button>"
            }
            else
            {
                alert("add item worth "+(1000-totalBill)+" to your cart")
            }
        }

        function getDiscount2()
        {
            if(totalBill>=2000)
            {
                let discount = totalBill*0.20;
                result.innerHTML="Total Bill="+totalBill+
                                  "<br> Discount 20% ="+discount+
                                   "<br> Final bill ="+(totalBill-discount)+
                                  "<br> <button>proceed to pay</button>"
            }
            else
            {
                alert("add item worth "+(2000-totalBill)+" to your cart")
            }
        }

        function getDiscount3()
        {
            if(totalBill>=3000)
            {
                let discount = totalBill*0.30;
                result.innerHTML="Total Bill="+totalBill+
                                  "<br> Discount 30% ="+discount+
                                   "<br> Final bill ="+(totalBill-discount)+
                                  "<br> <button>proceed to pay</button>"
            }
            else
            {
                alert("add item worth "+(3000-totalBill)+" to your cart")
            }
        }
    </script>
</body>
</html>
