<!--WAP to find and print mid no betn 3 nos-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 89;
        var b = 99;
        var c = 78;

        var mid =((a > b && a < c) || (a < b && a > c)) ? a :((b > a && b < c) || (b < a && b > c)) ? b : c;

        console.log("Middle number is:", mid);
    </script>
</body>
</html>
